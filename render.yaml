databases:
  - name: prpo-db
    plan: free
    databaseName: procurement
    user: procurement

services:
  - type: web
    name: prpo-portal
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: prpo-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      # Optional — enables real Claude AI summaries for Scope-of-Work uploads.
      # Leave unset to use the extractive (non-AI) fallback.
      - key: ANTHROPIC_API_KEY
        sync: false
